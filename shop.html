<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — EliteHub | Luxury Customizations</title>
  <meta name="description" content="Shop premium custom-printed oversized tees, hoodies, mugs, phone cases, cushions, totes and framed posters from EliteHub.">
  <meta name="theme-color" content="#070609">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&family=Kaushan+Script&family=Bebas+Neue&family=Permanent+Marker&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="manifest" href="manifest.webmanifest">
  <script src="js/pwa.js" defer></script>
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="hero-bg"></div>
      <div class="stars" data-stars="80"></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="sep">/</span><span id="crumbCurrent">Shop</span></nav>
        <h1 id="shopTitle">The <span class="gold-text">Shop</span></h1>
        <p id="shopLead">Premium prints on everything you love. Pick a favourite — or make it yours in our design studio.</p>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="shop-amazon-layout">
          <!-- Left Faceted Sidebar -->
          <aside class="shop-sidebar" id="shopSidebar">
            <div class="filter-group">
              <div class="filter-title"><span>Department</span></div>
              <div class="filter-list" id="sidebarCatList"></div>
            </div>
            <div class="filter-group">
              <div class="filter-title"><span>Price</span></div>
              <div class="filter-list" id="sidebarPriceList">
                <button type="button" class="filter-item active" data-price-filter="all"><span>All Prices</span></button>
                <button type="button" class="filter-item" data-price-filter="under-600"><span>Under ₹600</span></button>
                <button type="button" class="filter-item" data-price-filter="600-1000"><span>₹600 – ₹1,000</span></button>
                <button type="button" class="filter-item" data-price-filter="1000-1500"><span>₹1,000 – ₹1,500</span></button>
                <button type="button" class="filter-item" data-price-filter="above-1500"><span>Over ₹1,500</span></button>
              </div>
            </div>
            <div class="filter-group">
              <div class="filter-title"><span>Customer Reviews</span></div>
              <div class="filter-list" id="sidebarRatingList">
                <button type="button" class="filter-item active" data-rating-filter="all"><span>All Ratings</span></button>
                <button type="button" class="filter-item" data-rating-filter="4.5"><span>4.5★ &amp; Above</span></button>
                <button type="button" class="filter-item" data-rating-filter="4"><span>4.0★ &amp; Above</span></button>
              </div>
            </div>
            <div class="filter-group">
              <div class="filter-title"><span>Deals &amp; Tags</span></div>
              <div class="filter-list" id="sidebarTagList">
                <button type="button" class="filter-item active" data-tag-filter="all"><span>All Items</span></button>
                <button type="button" class="filter-item" data-tag-filter="bestseller"><span>Bestsellers</span></button>
                <button type="button" class="filter-item" data-tag-filter="trending"><span>Trending</span></button>
                <button type="button" class="filter-item" data-tag-filter="new"><span>New Arrivals</span></button>
              </div>
            </div>
            <button class="btn btn-ghost btn-sm btn-block" type="button" id="clearAllFiltersBtn" style="margin-top:14px">Reset Filters</button>
          </aside>

          <!-- Main Products Area -->
          <div class="shop-main">
            <div class="shop-toolbar">
              <div class="chips" id="catChips" role="tablist" aria-label="Filter by category"></div>
              <div class="toolbar-right">
                <label class="search-field"><i data-icon="search"></i><input type="search" id="shopSearch" placeholder="Search products" aria-label="Search products"></label>
                <select class="select" id="shopSort" aria-label="Sort products" style="width:auto;height:40px;border-radius:99px">
                  <option value="featured">Featured</option>
                  <option value="trending">Trending</option>
                  <option value="new">Newest</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="rating">Top Rated</option>
                </select>
              </div>
            </div>
            <p class="result-count" id="resultCount" aria-live="polite"></p>
            <div class="product-grid cols-4" id="shopGrid"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="studio-band" style="padding:60px 0">
      <div class="stars" data-stars="60"></div>
      <div class="container" style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div class="studio-copy reveal">
          <h2 style="margin-bottom:10px">Can't find it?<br><span class="gold-text">Design it.</span></h2>
          <p style="margin:0">Add your own text, photos or artwork to any product — we print it just for you.</p>
        </div>
        <a class="btn btn-gold reveal d1" href="3d-preview/customizer.html">Open 3D Studio <i data-icon="arrow" class="ico-arrow"></i></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/mockups.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/firebase.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
