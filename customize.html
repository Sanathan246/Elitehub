<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EliteHub 3D Studio</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="3d-preview/customizer.html">
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const destination = new URL('3d-preview/customizer.html', location.href);
      const aliases = { tshirt: 'tee', tee: 'tee', hoodie: 'hoodie', mug: 'mug', phonecase: 'phonecase', tote: 'tote', cushion: 'cushion', frame: 'frame', poster: 'frame' };
      const id = params.get('id');
      const product = params.get('template') || params.get('product');
      if (id) destination.searchParams.set('id', id);
      else if (product) {
        const key = product.toLowerCase();
        destination.searchParams.set('template', aliases[key] || key);
      } else if (params.get('start') === 'upload') {
        destination.searchParams.set('start', 'upload');
      } else if (['color', 'design', 'text', 'demo', 'model'].some((key) => params.has(key))) {
        destination.searchParams.set('template', 'tee');
      }
      ['color', 'design', 'text', 'demo', 'model'].forEach((key) => {
        const value = params.get(key);
        if (value) destination.searchParams.set(key, value);
      });
      location.replace(destination.toString());
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=3d-preview/customizer.html"></noscript>
</head>
<body>
  <main><p>Opening the EliteHub 3D Studio… <a href="3d-preview/customizer.html">Continue</a></p></main>
</body>
</html>
